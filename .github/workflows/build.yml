name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Loom 1.18 needs a JDK 25 to run Gradle; the mod itself is compiled for Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build test --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: llmbuilder-jar
          path: build/libs/*.jar
